# Configuración de CanchApp Backend.
# Los secretos NO se escriben aquí: se leen de variables de entorno o del archivo .env
# local (fuera de Git). Copia .env.example a .env y completa los valores.
spring.config.import=optional:file:.env[.properties]

server.port=8080
spring.jackson.time-zone=America/Guayaquil

# Base de datos (PostgreSQL de docker-compose.yml)
spring.datasource.url=${CANCHAPP_DB_URL:jdbc:postgresql://localhost:5432/canchapp}
spring.datasource.username=${CANCHAPP_DB_USUARIO}
spring.datasource.password=${CANCHAPP_DB_CONTRASENA}

# El esquema lo crean SOLO las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zohttps://github.com/cedenodaniela/APP_CANCHA_BACKEND/pull/4/conflict?name=.env.example&ancestor_oid=de237fbbef42b3a843cc745f9162e4235ec343db&base_oid=0935fcd2f6e57a9914aa7e06a23ac571f12a6258&head_oid=ded43a9f75ecb93be31659fe75207d40ac4c7bf0ne=America/Guayaquil

# Seguridad (RF-01, RNF-02): JWT firmado con HS256 que vence a las 24 h
canchapp.seguridad.jwt-secreto=${CANCHAPP_JWT_SECRETO}
canchapp.seguridad.jwt-vigencia=24h
# Orígenes del panel web (APP_CANCHA_WEB) en desarrollo. La app Android no usa CORS.
canchapp.seguridad.cors-origenes=${CANCHAPP_CORS_ORIGENES:http://localhost:4200}

# Primer administrador (RF-18): se crea al arrancar solo si todavía no existe ninguno.
# Sin CANCHAPP_ADMIN_EMAIL o CANCHAPP_ADMIN_CONTRASENA no se siembra nada.
canchapp.admin-inicial.nombre=${CANCHAPP_ADMIN_NOMBRE:Administrador}
canchapp.admin-inicial.apellido=${CANCHAPP_ADMIN_APELLIDO:Complejo}
canchapp.admin-inicial.email=${CANCHAPP_ADMIN_EMAIL:}
canchapp.admin-inicial.contrasena=${CANCHAPP_ADMIN_CONTRASENA:}
# Correo SMTP (RF-02). En desarrollo, Mailpit de docker-compose.yml recibe los correos
# en localhost:1025 y los muestra en http://localhost:8025.
spring.mail.host=${CANCHAPP_SMTP_HOST:localhost}
spring.mail.port=${CANCHAPP_SMTP_PUERTO:1025}
spring.mail.username=${CANCHAPP_SMTP_USUARIO:}
spring.mail.password=${CANCHAPP_SMTP_CONTRASENA:}
spring.mail.properties.mail.smtp.auth=${CANCHAPP_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${CANCHAPP_SMTP_TLS:false}
canchapp.correo.remitente=${CANCHAPP_CORREO_REMITENTE:CanchApp <no-responder@canchapp.local>}

# Enlace del correo de recuperación (RF-02): la página /recuperar-contrasena de esta API, que
# abre la app. Debe ser una dirección que el celular alcance: en desarrollo, localhost:8080 con
# adb reverse; en producción, la URL HTTPS pública del backend.
canchapp.recuperacion.url-enlace=${CANCHAPP_URL_RECUPERACION:http://localhost:8080/recuperar-contrasena}
