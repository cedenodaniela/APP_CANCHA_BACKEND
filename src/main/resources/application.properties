# Configuración de CanchApp Backend.
# Los secretos NO se escriben aquí: se leen de variables de entorno o del archivo .env
# local (fuera de Git). Copia .env.example a .env y completa los valores.
spring.config.import=optional:file:.env[.properties]

server.port=8080
spring.jackson.time-zone=America/Guayaquil

# Base de datos (PostgreSQL de docker-compose.yml)
spring.datasource.url=${CANCHAPP_DB_URL:jdbc:postgresql://localhost:5432/canchapp}
spring.datasource.username=${CANCHAPP_DB_USUARIO}
spring.datasource.password=${CANCHAPP_DB_CONTRASENA}

# El esquema lo crean SOLO las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Guayaquil
