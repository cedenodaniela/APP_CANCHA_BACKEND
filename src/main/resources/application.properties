# Configuración de CanchApp Backend.
# Los secretos NO se escriben aquí: se leen de variables de entorno o del archivo .env
# local (fuera de Git). Copia .env.example a .env y completa los valores.
spring.config.import=optional:file:.env[.properties]

server.port=8080
spring.jackson.time-zone=America/Guayaquil

# Base de datos (PostgreSQL de docker-compose.yml)
spring.datasource.url=${CANCHAPP_DB_URL:jdbc:postgresql://localhost:5432/canchapp}
spring.datasource.username=${CANCHAPP_DB_USUARIO}
spring.datasource.password=${CANCHAPP_DB_CONTRASENA}

# El esquema lo crean SOLO las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Guayaquil

# Seguridad (RF-01, RNF-02): JWT firmado con HS256 que vence a las 24 h
canchapp.seguridad.jwt-secreto=${CANCHAPP_JWT_SECRETO}
canchapp.seguridad.jwt-vigencia=24h
# Orígenes del panel web (APP_CANCHA_WEB) en desarrollo. La app Android no usa CORS.
canchapp.seguridad.cors-origenes=${CANCHAPP_CORS_ORIGENES:http://localhost:4200}

# Primer administrador (RF-18): se crea al arrancar solo si todavía no existe ninguno.
# Sin CANCHAPP_ADMIN_EMAIL o CANCHAPP_ADMIN_CONTRASENA no se siembra nada.
canchapp.admin-inicial.nombre=${CANCHAPP_ADMIN_NOMBRE:Administrador}
canchapp.admin-inicial.apellido=${CANCHAPP_ADMIN_APELLIDO:Complejo}
canchapp.admin-inicial.email=${CANCHAPP_ADMIN_EMAIL:}
canchapp.admin-inicial.contrasena=${CANCHAPP_ADMIN_CONTRASENA:}
