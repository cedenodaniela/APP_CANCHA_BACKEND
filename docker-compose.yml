# Base de datos y correo locales de CanchApp.
# Las credenciales se leen de .env (copia .env.example). El esquema NO se crea aquí:
# lo crean las migraciones de Flyway al arrancar el backend.

services:
  db:
    image: postgres:15
    container_name: canchapp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CANCHAPP_DB_NOMBRE:-canchapp}
      POSTGRES_USER: ${CANCHAPP_DB_USUARIO:?Define CANCHAPP_DB_USUARIO en .env}
      POSTGRES_PASSWORD: ${CANCHAPP_DB_CONTRASENA:?Define CANCHAPP_DB_CONTRASENA en .env}
      TZ: America/Guayaquil
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor SMTP de desarrollo (RF-02): recibe los correos de la API sin enviarlos a nadie
  # y los muestra en http://localhost:8025 (desde el emulador, http://10.0.2.2:8025).
  correo:
    image: axllent/mailpit:v1.21
    container_name: canchapp_correo
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pg_data:
