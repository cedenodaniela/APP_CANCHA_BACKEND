name: CI

on:
  push:
    branches: [main, calidad, desarrollo]
  pull_request:
    branches: [main, calidad, desarrollo]

jobs:
  backend:
    name: Compilación y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verificar (compilación y pruebas)
        run: ./mvnw -B -ntp verify

      - name: Guardar reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: target/surefire-reports/

      # Cuando exista springdoc, este trabajo publica el openapi.json que validan
      # APP_CANCHA_MOVIL y APP_CANCHA_WEB (app_cancha/AGENTS.md §4 y §12).
